name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    # Build the image (no push) on every change, so a broken Dockerfile is caught before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: alertmux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name alertmux -e ADMIN_PASSWORD=ci-password-123 -p 8080:8080 -p 2525:25 alertmux:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          # No destination is configured yet, so the relay must answer with a temporary 451.
          # Paced on purpose: smtp-server rejects clients that talk before the greeting.
          { sleep 1; printf 'EHLO ci\r\n'; sleep 0.5; printf 'MAIL FROM:<a@example.com>\r\n'; sleep 0.5
            printf 'RCPT TO:<b@example.com>\r\n'; sleep 0.5; printf 'DATA\r\n'; sleep 0.5
            printf 'Subject: ci\r\n\r\nhi\r\n.\r\n'; sleep 1; printf 'QUIT\r\n'; sleep 0.5; } \
            | nc -w 10 127.0.0.1 2525 | tee smtp.log
          grep -q '^451' smtp.log
      - if: failure()
        run: docker logs relay
