<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · Alertmux</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/messages.js"></script>
</head>
<body>
  <main>
    <div class="row">
      <h1>Messages</h1>
      <span class="spacer"></span>
      <label class="inline"><input type="checkbox" id="live" checked> Live</label>
      <button id="pause" type="button" class="small">Pause</button>
      <span id="pending" class="badge hidden"></span>
    </div>

    <form id="filters" class="row filters card" role="search">
      <input type="search" name="q" placeholder="Search sender, recipient, subject, IP, ID…" aria-label="Search">
      <select name="status" aria-label="Status">
        <option value="">All statuses</option>
        <option>queued</option><option>sending</option><option>retrying</option>
        <option>sent</option><option>partial</option><option>failed</option><option>rejected</option>
      </select>
      <label class="inline">From <input type="date" name="from"></label>
      <label class="inline">To <input type="date" name="to"></label>
      <button type="reset" class="small">Clear</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Status</th><th>From</th><th>To</th><th>Subject</th><th>Size</th><th>Client</th><th>Tries</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">No messages match.</div>
    </div>
    <p class="row"><button id="older" type="button" class="hidden">Load older</button></p>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <header>
      <h2 id="detail-title">Message</h2>
      <button type="button" id="retry" class="small">Retry</button>
      <a id="download" class="btn small" href="#">Download .eml</a>
      <button type="button" id="delete" class="small danger">Delete</button>
      <button type="button" id="close" class="small" aria-label="Close">✕</button>
    </header>
    <div class="body" id="detail-body"></div>
  </dialog>
</body>
</html>
