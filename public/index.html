<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Alertmux</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <main>
    <h1>Dashboard</h1>
    <div id="setup" class="callout warn hidden">
      No delivery destination is set up yet, so incoming mail is refused with a temporary error.
      <a href="/destinations">Add a Microsoft 365 or Google destination</a>.
    </div>
    <h2>Last 24 hours</h2>
    <div class="grid" id="stats24"></div>
    <h2 class="mt">Last 7 days</h2>
    <div class="grid" id="stats7"></div>
    <div class="grid two">
      <section class="card">
        <h2>SMTP listener</h2>
        <div id="listener"></div>
      </section>
      <section class="card">
        <h2>Destinations</h2>
        <div id="dests"></div>
      </section>
    </div>
    <section class="card">
      <div class="row"><h2>Recent problems</h2><span class="spacer"></span><a href="/events">All events</a></div>
      <div id="problems"></div>
    </section>
  </main>
</body>
</html>
