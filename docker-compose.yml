# Install:  docker compose up -d          (pulls the published image)
# Upgrade:  docker compose pull && docker compose up -d
# Source:   docker compose up -d --build  (builds this checkout instead)
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/makizm/alertmux:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SMTP_HOST_PORT:-25}:25"     # SMTP (plain). Restrict who can reach it with a firewall and the allowlist in Settings.
      - "${HTTP_HOST_PORT:-8080}:8080" # Admin UI. Put it behind HTTPS (reverse proxy) or keep it on a private network.
    volumes:
      - relay-data:/data
volumes:
  relay-data:
